name: Sync release notes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - .github/workflows/release-notes.yml

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download existing release package
        run: gh release download v1.1.0 --repo "$GITHUB_REPOSITORY" --pattern 'ExcelToiPhoneVCF-1.1.0-windows-x64.zip' --dir release-docs
      - name: Update bundled README and checksum
        run: python3 tools/update_release_docs.py release-docs/ExcelToiPhoneVCF-1.1.0-windows-x64.zip
      - name: Upload documentation-corrected package
        run: gh release upload v1.1.0 release-docs/ExcelToiPhoneVCF-1.1.0-windows-x64.zip release-docs/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Update existing release description
        run: |
          gh release edit v1.1.0 --repo "$GITHUB_REPOSITORY" --title 'v1.1.0 - Excel 转手机通讯录（iPhone / Android）' --notes-file CHANGELOG.md
